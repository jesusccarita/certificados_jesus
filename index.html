document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  cards.forEach(c=>c.classList.toggle('hide',t.dataset.f!=='todos'&&c.dataset.s!==t.dataset.f));
});
function vis(){return cards.filter(c=>!c.classList.contains('hide'));}
function show(c){
  cur=vis().indexOf(c);
  document.getElementById('mi').src=c.querySelector('img').src;
  document.getElementById('mi').alt=c.querySelector('img').alt;
  document.getElementById('mt').textContent=c.querySelector('h3').textContent;
  document.getElementById('mo').textContent=c.querySelector('.org').textContent+' · '+c.querySelector('.meta').textContent;
  document.getElementById('ma').href=c.dataset.href;
  if(!m.open)m.showModal();
}
cards.forEach(c=>c.onclick=()=>show(c));
function step(d){const v=vis();show(v[(cur+d+v.length)%v.length]);}
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('mc').onclick=()=>m.close();
m.addEventListener('click',e=>{if(e.target===m)m.close();});
document.addEventListener('keydown',e=>{if(!m.open)return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
</script>
</body>
</html>
